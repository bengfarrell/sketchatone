name: Test Suite

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs-src/**'
      - 'docs/**'
      - 'eleventy.config.mjs'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs-src/**'
      - 'docs/**'
      - 'eleventy.config.mjs'
      - '.github/workflows/deploy-docs.yml'

jobs:
  test-nodejs:
    name: Node.js Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [18.x, 20.x]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci

    - name: Install Rollup native binding
      shell: bash
      run: |
        # Work around platform-specific optional dependencies missing from the lockfile.
        ROLLUP_VERSION=$(node -p "require('./node_modules/rollup/package.json').version")
        ROLLUP_PLATFORM=$(node -p "process.platform + '-' + process.arch + (process.platform === 'linux' ? '-gnu' : '')")
        npm install --no-save --package-lock=false --ignore-scripts "@rollup/rollup-${ROLLUP_PLATFORM}@${ROLLUP_VERSION}"
    
    - name: Build
      run: npm run build:cli
    
    - name: Setup Virtual MIDI (Linux, optional)
      if: runner.os == 'Linux'
      run: |
        if sudo modprobe snd-virmidi; then
          echo "Virtual MIDI module loaded"
          lsmod | grep snd_virmidi
          aplaymidi -l || true
        else
          echo "::warning::Virtual MIDI unavailable on this runner; virtual MIDI integration tests will not exercise MIDI."
        fi
    
    - name: Setup Virtual MIDI (macOS)
      if: runner.os == 'macOS'
      run: |
        # IAC Driver should be available by default on macOS
        # Just verify we can detect it
        echo "IAC Driver should be available on macOS"
    
    - name: Run unit tests
      run: npm test -- test/unit/
    
    - name: Run virtual MIDI integration tests
      run: npm test -- test/integration/virtual-midi.test.ts
      # Continue on error for now since macOS IAC might not be enabled in CI
      continue-on-error: true

  test-python:
    name: Python Tests
    runs-on: ${{ matrix.os }}
    env:
      KIVY_NO_ARGS: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: 'python/pyproject.toml'
    
    - name: Install dependencies
      run: |
        cd python
        pip install -e ".[dev,ui]"

    - name: Install virtual display for UI tests
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb xauth libgl1 libegl1 libgl1-mesa-dri
    
    - name: Setup Virtual MIDI (Linux, optional)
      if: runner.os == 'Linux'
      run: |
        if sudo modprobe snd-virmidi; then
          echo "Virtual MIDI module loaded"
          lsmod | grep snd_virmidi
          aplaymidi -l || true
        else
          echo "::warning::Virtual MIDI unavailable on this runner; virtual MIDI integration tests will not exercise MIDI."
        fi
    
    - name: Run unit tests
      shell: bash
      run: |
        cd python
        if [ "$RUNNER_OS" = "Linux" ]; then
          xvfb-run -a python -m pytest tests/unit/ -v -s
        else
          # Hosted macOS runners cannot create the OpenGL window these tests require.
          echo "::notice::Skipping Kivy app, panel widget, and hot-reload tests on macOS; Linux runs them under Xvfb."
          python -m pytest tests/unit/ -v -s \
            --ignore=tests/unit/test_ui_app.py \
            --ignore=tests/unit/test_ui_panel_widgets.py \
            --deselect=tests/unit/test_ui_cli.py::TestHotReloadApp
        fi
    
    - name: Run integration tests (config loading)
      run: |
        cd python
        pytest tests/integration/test_config_loading.py -v

    - name: Run virtual MIDI integration tests
      run: |
        cd python
        pytest tests/integration/test_virtual_midi.py -v
      continue-on-error: true

  test-coverage:
    name: Test Coverage Report
    runs-on: ubuntu-latest
    env:
      KIVY_NO_ARGS: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: 'python/pyproject.toml'
    
    - name: Install dependencies
      run: |
        npm ci
        cd python && pip install -e ".[dev,ui]"

    - name: Install virtual display for UI tests
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb xauth libgl1 libegl1 libgl1-mesa-dri

    - name: Install Rollup native binding
      shell: bash
      run: |
        # Work around platform-specific optional dependencies missing from the lockfile.
        ROLLUP_VERSION=$(node -p "require('./node_modules/rollup/package.json').version")
        ROLLUP_PLATFORM=$(node -p "process.platform + '-' + process.arch + (process.platform === 'linux' ? '-gnu' : '')")
        npm install --no-save --package-lock=false --ignore-scripts "@rollup/rollup-${ROLLUP_PLATFORM}@${ROLLUP_VERSION}"
    
    - name: Setup Virtual MIDI (optional)
      run: |
        if sudo modprobe snd-virmidi; then
          echo "Virtual MIDI module loaded"
          lsmod | grep snd_virmidi
        else
          echo "::warning::Virtual MIDI unavailable on this runner; virtual MIDI integration tests will not exercise MIDI."
        fi
    
    - name: Run all tests with coverage
      run: |
        npm run build:cli
        npm test -- --coverage || true
        cd python && xvfb-run -a python -m pytest -s --cov=sketchatone --cov-report=term || true
    
    - name: Test Summary
      run: |
        echo "✅ Test suite completed"
        echo "See individual job results for details"
